name: gesco
description: GESCO - gestion des notes scolaires, 100 % hors ligne (SQLite local).
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  # Textes du système (menus copier/coller, calendriers) en français.
  flutter_localizations:
    sdk: flutter
  # SQLite local. Aucune dépendance réseau.
  sqflite_common_ffi: ^2.3.3
  sqlite3_flutter_libs: ^0.5.0
  path: ^1.9.0
  path_provider: ^2.1.4
  # Sélecteur de fichier (logo, photos, sauvegardes) : boîte de dialogue
  # native du système, fonctionne hors ligne.
  file_picker: ^8.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
